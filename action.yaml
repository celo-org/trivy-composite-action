name: Trivy
description: "Run a Trivy Scan and generate reports"

inputs:
  scan-type:
    description: "Type of scan: image or fs (filesystem)"
    required: true
    type: string
    enum: [image, fs]
  image-ref:
    description: "Image to scan (required if scan-type is image)"
    type: string
  scan-ref:
    description: "Path to scan (required if scan-type is fs)"
    type: string
  timeout:
    description: "Timeout for the scan"
    default: 15m
    type: string
  vuln-type:
    description: "Vulnerability types to include (os, library)"
    default: "os,library"
    type: string
  severity:
    description: "Comma-separated list of severity levels (UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL)"
    default: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
    type: string
    enum: [UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL]
  output-file:
    description: "Base name for the output files"
    default: "trivy"
    type: string
  skip-dirs:
    description: "Comma-separated list of directories to skip during the scan"
    type: string
  ignore-unfixed:
    description: "Ignore unfixed vulnerabilities"
    default: false
    type: boolean
  offline-scan:
    description: "Perform an offline scan without network access"
    default: false
    type: boolean
  pr-comment:
    description: "Post results as a comment on the pull request"
    default: false
    type: boolean

outputs:
  report-name:
    description: "Generated Trivy report name"
    value: ${{ steps.generate-report-name.outputs.name }}
  sarif-file:
    description: "Generated SARIF file path"
    value: ${{ steps.convert-sarif.outputs.sarif }}
  text-report:
    description: "Generated human-readable text report"
    value: ${{ steps.convert-text.outputs.text }}
  json-report:
    description: "Generated JSON report path"
    value: ${{ inputs.output-file }}.json

runs:
  using: "composite"
  steps:
    - name: Cache Trivy Database
      uses: actions/cache@v3
      with:
        path: ~/.cache/trivy
        key: ${{ runner.os }}-trivy-db
        restore-keys: |
          ${{ runner.os }}-trivy-db

    - name: Validate Required Inputs
      shell: bash
      run: |
        if [[ "${{ inputs.scan-type }}" == "image" && -z "${{ inputs.image-ref }}" ]]; then
          echo "::error::scan-type=image requires image-ref"
          exit 1
        elif [[ "${{ inputs.scan-type }}" == "fs" && -z "${{ inputs.scan-ref }}" ]]; then
          echo "::error::scan-type=fs requires scan-ref"
          exit 1
        fi

    - name: Generate Report Name
      id: generate-report-name
      env:
        IMAGE: ${{ inputs.image-ref }}
        SCAN_REF: ${{ inputs.scan-ref }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      shell: bash
      run: |
        if [ -n "$IMAGE" ]; then
          basename="$(basename $IMAGE)"
          stripped_name="${basename%:*}-${basename##*:}"
        else
          if [ "$SCAN_REF" == "." ]; then
            SCAN_REF=$(pwd)
          fi
          basename="$(basename $SCAN_REF)"
          stripped_name="${basename}-$(openssl rand -hex 6)"
        fi
        echo "name=${stripped_name}-${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT

    - name: Run Trivy Scan
      id: trivy-scan
      uses: aquasecurity/trivy-action@0.30.0
      with:
        scan-type: ${{ inputs.scan-type }}
        image-ref: ${{ inputs.image-ref }}
        scan-ref: ${{ inputs.scan-ref }}
        timeout: ${{ inputs.timeout }}
        vuln-type: ${{ inputs.vuln-type }}
        severity: ${{ inputs.severity }}
        format: json
        output: ${{ inputs.output-file }}.json
        skip-dirs: ${{ inputs.skip-dirs }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        offline-scan: ${{ inputs.offline-scan }}

    - name: Upload JSON Report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.generate-report-name.outputs.name }}-trivy-report
        path: ${{ inputs.output-file }}.json

    - name: Convert JSON to SARIF
      id: convert-sarif
      shell: bash
      run: |
        trivy convert --format sarif --output ${{ inputs.output-file }}.sarif ${{ inputs.output-file }}.json
        echo "sarif=${{ inputs.output-file }}.sarif" >> $GITHUB_OUTPUT

    - name: Convert JSON to Text Report
      id: convert-text
      shell: bash
      run: |
        trivy convert --format table --output ${{ inputs.output-file }}.txt ${{ inputs.output-file }}.json
        echo "text=${{ inputs.output-file }}.txt" >> $GITHUB_OUTPUT

    - name: Post Results as PR Comment
      if: ${{ inputs.pr-comment }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        JSON_FILE: ${{ inputs.output-file }}.json
      shell: bash
      run: |
        comment_body="### Trivy Scan Results\n"
        comment_body+="\n**Scan Type**: ${{ inputs.scan-type }}"
        comment_body+="\n**Severity Levels**: ${{ inputs.severity }}"
        comment_body+="\n\n#### Vulnerabilities Found:\n"
        comment_body+="\n\`\`\`json\n$(jq -r '.Vulnerabilities[] | {Severity, VulnerabilityID, PkgName}' $JSON_FILE)\n\`\`\`"
        gh pr comment ${{ github.event.pull_request.number }} --body "${comment_body}"
